plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.vit.tsedemo'
    compileSdk 34

    defaultConfig {
        applicationId 'edu.vit.tsedemo'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // one APK per CPU type keeps each APK small; x86_64 is for the emulator
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    buildTypes {
        release {
            // shrink unused library code; ONNX Runtime classes are kept (called from native code)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // compress the native library and the models inside the APK (smaller download; they are
    // extracted / read into memory once at start-up)
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
